# Tawasul Academy — Docker Compose (Development)

services:

  # ─────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: tawasul_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tawasul_db
      POSTGRES_USER: tawasul
      POSTGRES_PASSWORD: tawasul_pass
    ports:
      # 5433 on host because the default host port 5432 is occupied by another container
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tawasul -d tawasul_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tawasul_network

  # ─────────────────────────────────────────
  # pgAdmin (Development Only)
  # ─────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tawasul_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tawasul_network

  # ─────────────────────────────────────────
  # Nuxt App
  # ─────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: tawasul_app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nuxt
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tawasul_network

# ─────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────
volumes:
  postgres_data:
  uploads_data:

# ─────────────────────────────────────────
# Networks
# ─────────────────────────────────────────
networks:
  tawasul_network:
    driver: bridge
