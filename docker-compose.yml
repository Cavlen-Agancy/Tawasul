# Tawasul Academy — Docker Compose (Development)
#
# Development architecture:
#   Docker: PostgreSQL (+ pgAdmin) + LiveKit
#   Host:   Nuxt app via `npm run dev`

services:

  # ─────────────────────────────────────────
  # PostgreSQL Database (unchanged)
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: tawasul_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tawasul_db
      POSTGRES_USER: tawasul
      POSTGRES_PASSWORD: tawasul_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tawasul -d tawasul_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tawasul_network

  # ─────────────────────────────────────────
  # pgAdmin (Development Only, unchanged)
  # ─────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tawasul_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tawasul_network

  # ─────────────────────────────────────────

  # ─────────────────────────────────────────
  # LiveKit Server
  # ─────────────────────────────────────────
  livekit:
    image: livekit/livekit-server:v1.13.7
    container_name: tawasul_livekit
    environment:
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - "LIVEKIT_KEYS=${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    ports:
      - "7880:7880"      # HTTP/WebSocket
      - "7881:7881"      # RTC TCP
      - "7882:7882/udp"  # RTC UDP
      - "50000-50100:50000-50100/udp"  # ICE UDP range (must match livekit.yaml rtc.port_range_*)
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    command: --config /etc/livekit.yaml
    networks:
      - tawasul_network
    restart: unless-stopped

# ─────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────
volumes:
  postgres_data:
  uploads_data:

# ─────────────────────────────────────────
# Networks
# ─────────────────────────────────────────
networks:
  tawasul_network:
    driver: bridge
