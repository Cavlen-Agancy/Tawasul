name: tawasul

services:

  db:
    image: postgres:16-alpine
    container_name: tawasul_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tawasul_db
      POSTGRES_USER: ${POSTGRES_USER:-tawasul}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tawasul} -d tawasul_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    mem_limit: 1g
    cpus: 1.0

  migrate:
    image: tawasul-app:latest
    pull_policy: never
    container_name: tawasul_migrate
    env_file:
      - .env
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  app:
    image: tawasul-app:latest
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: tawasul_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    expose:
      - "3000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
      - proxy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    mem_limit: 1g
    cpus: 1.0

  livekit:
    image: livekit/livekit-server:v1.13.7
    container_name: tawasul_livekit
    restart: unless-stopped
    environment:
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:?required}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:?required}
      - "LIVEKIT_KEYS=${LIVEKIT_API_KEY:?required}: ${LIVEKIT_API_SECRET:?required}"
    volumes:
      - ./livekit.prod.yaml:/etc/livekit.yaml
    command: --config /etc/livekit.yaml
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"
    networks:
      - proxy
    mem_limit: 512m
    cpus: 1.0

volumes:
  postgres_data:
  uploads_data:

networks:
  internal:
    driver: bridge
  proxy:
    external: true
    name: proxy
