# Tawasul Academy — Docker Compose (Production)

services:

  # ─────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: tawasul_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tawasul_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d tawasul_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tawasul_network
    # No ports exposed — only accessible inside the Docker network

  # ─────────────────────────────────────────
  # Nuxt App
  # ─────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: tawasul_app
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tawasul_network
    # No ports exposed — Nginx handles all incoming traffic

  # ─────────────────────────────────────────
  # Nginx Reverse Proxy
  # ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: tawasul_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - tawasul_network

  # ─────────────────────────────────────────
  # Certbot (SSL)
  # ─────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: tawasul_certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Run manually to issue or renew certificates:
    # docker compose -f docker-compose.prod.yml run --rm certbot certonly \
    #   --webroot --webroot-path=/var/www/certbot \
    #   --email your@email.com --agree-tos --no-eff-email \
    #   -d yourdomain.com -d www.yourdomain.com
    networks:
      - tawasul_network

# ─────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────
volumes:
  postgres_data:
  uploads_data:
  certbot_certs:
  certbot_www:

# ─────────────────────────────────────────
# Networks
# ─────────────────────────────────────────
networks:
  tawasul_network:
    driver: bridge
